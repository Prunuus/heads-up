[pytest]
markers =
    slow: full simulation, tuning, or training runs (deselected by default; run with -m slow)
addopts = -m "not slow"
# fastapi.testclient (test_agent.py, tests/test_policy.py) imports starlette's TestClient,
# which warns that it still uses httpx. Nothing in the bot depends on it.
filterwarnings =
    ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning
